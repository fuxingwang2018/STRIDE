training:
  data:
    batch_size: 16
    num_workers: 0
    pin_memory: true
    persistent_workers: true
    prefetch_factor_train: 4
    prefetch_factor_val: 2
    shuffle_train: true
    drop_last_train: false
    shuffle_val: false
    drop_last_val: false


  device:
    accelerator: "auto"

  loop:
    max_epochs: 15    
    max_train_batches: null
    max_val_batches: null
    validate_every_n_epochs: 1

  optimizer:
    name: "adamw"
    lr: 0.0003
    weight_decay: 0.000001
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    enabled: true
    name: "ReduceLROnPlateau"
    params: {"factor": 0.5, "patience": 15, "threshold": 0.01, "min_lr": 1e-6}

  ema:
    enabled: true
    decay: 0.999
    update_after_step: 0
    update_every: 1

  checkpointing:
    enabled: true
    save_every_n_epochs: 5
    save_best: true
    resume_from: null #'/mimer/NOBACKUP/groups/naiss2025-6-138/HCLIMAI/STRIDE_RUNS/pipeline_norcp_pr_zscore_ep150/training/checkpoints/checkpoint_epoch_0120.pt'

  validation:
    enabled: true
    use_ema_model: true
    run_sampling_preview: false

  logging:
    print_every_n_steps: 10
    log_parameter_count: true
    log_batch_shapes_once: true
    print_step_progress: false
    save_history_json: true
  
  generation_preview:
    enabled: true
    use_ema_model: true
    every_n_epochs: 5
    on_improved_val: true
    min_epoch: 3
    fixed_val_indices: [0,1]
    save_arrays: true
    save_plots: true
    output_subdir: "training_generation_preview"

  monitoring:
    enabled: true
    compute_every_n_epochs: 5
    save_history_plots: true
    output_subdir: "monitoring"
    wet_threshold: 0.1
    high_quantiles: [0.99, 0.999]
    smoothing_alpha: 0.3
